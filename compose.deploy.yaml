# Single-operator HTTPS deployment. Point DNS to your server and expose TCP 80/443.
# Use: docker compose --env-file .env.production -f compose.deploy.yaml up -d --build
x-db-url: &db-url postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:?set POSTGRES_DB}

services:
  database:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - omega-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      OMEGA_API_KEY: ${OMEGA_API_KEY:?set OMEGA_API_KEY}
      OMEGA_ENGINE_PATH: /usr/local/bin/omega-engine
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      OMEGA_ENGINE_PATH: /usr/local/bin/omega-engine
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 140s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    restart: unless-stopped
    environment:
      OMEGA_SITE_ADDRESS: ${OMEGA_SITE_ADDRESS:?set OMEGA_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  omega-postgres:
  caddy-data:
  caddy-config:
